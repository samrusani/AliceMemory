# Recommended bridge deployment shape.
# Keep the Alice memory provider active for always-on prefetch/capture,
# and keep Alice MCP attached for explicit deep workflows.
memory:
  provider: alice

mcp_servers:
  alice_core:
    command: "/path/to/alicebot/.venv/bin/python"
    args: ["-m", "alicebot_api.mcp_server"]
    env:
      DATABASE_URL: "postgresql://alicebot_app:alicebot_app@localhost:5432/alicebot"
      ALICEBOT_AUTH_USER_ID: "00000000-0000-0000-0000-000000000001"
      PYTHONPATH: "/path/to/alicebot/apps/api/src:/path/to/alicebot/workers"
      # Recommended for agent-bound runs. Issue with `alicebot agent keys create`.
      ALICE_AGENT_API_KEY: "alice_sk_replace_with_issued_key"
      # Include list names full-surface core tools. LEGACY does not imply them.
      ALICE_MCP_FULL_TOOLS: "1"
    tools:
      include:
        - alice_memory_commit
        - alice_recall
        - alice_resume
        - alice_open_loops
        - alice_memory_review
        - alice_memory_correct
        - alice_explain
        - alice_context_pack
        - alice_recent_decisions
      resources: false
      prompts: false
