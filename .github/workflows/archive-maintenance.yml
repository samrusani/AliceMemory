name: Archive Maintenance

on:
  workflow_dispatch:
    inputs:
      schedule:
        description: Schedule metadata for this maintenance run.
        required: true
        default: manual
        type: choice
        options:
          - nightly
          - weekly
          - manual
      include_benchmark:
        description: Run benchmark regeneration during this run.
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "17 2 * * *"
    - cron: "23 4 * * 1"

# The job that installs packages holds no write permission. A failed run opens its
# [ops] issue from a separate job, archive-alert, which holds issues: write, checks
# out nothing, runs no shell and installs nothing.
permissions:
  contents: read

concurrency:
  group: archive-maintenance
  cancel-in-progress: false

jobs:
  archive-maintenance:
    name: Archive Maintenance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
        env:
          POSTGRES_USER: alicebot_admin
          POSTGRES_PASSWORD: alicebot_admin
          POSTGRES_DB: alicebot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alicebot_admin -d alicebot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_ADMIN_URL: postgresql://alicebot_admin:alicebot_admin@localhost:5432/alicebot
      DATABASE_URL: postgresql://alicebot_app:alicebot_app@localhost:5432/alicebot
      ALICEBOT_AUTH_USER_ID: 00000000-0000-0000-0000-000000000001

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Prepare database
        env:
          PGHOST: localhost
          PGPASSWORD: alicebot_admin
          POSTGRES_USER: alicebot_admin
          POSTGRES_DB: alicebot
          ALICEBOT_APP_USER: alicebot_app
          ALICEBOT_APP_PASSWORD: alicebot_app
        run: |
          infra/postgres/init/001_roles.sh
          python -m alembic -c apps/api/alembic.ini upgrade head

      - name: Resolve schedule mode
        id: schedule
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            resolved_schedule="${{ inputs.schedule }}"
            include_benchmark="${{ inputs.include_benchmark }}"
          elif [[ "${{ github.event.schedule }}" == "23 4 * * 1" ]]; then
            resolved_schedule="weekly"
            include_benchmark="true"
          else
            resolved_schedule="nightly"
            include_benchmark="false"
          fi

          echo "schedule=${resolved_schedule}" >> "$GITHUB_OUTPUT"
          echo "include_benchmark=${include_benchmark}" >> "$GITHUB_OUTPUT"

      - name: Run archive maintenance
        run: |
          args=(
            --schedule "${{ steps.schedule.outputs.schedule }}"
            --database-url "$DATABASE_URL"
            --user-id "$ALICEBOT_AUTH_USER_ID"
          )

          if [[ "${{ steps.schedule.outputs.include_benchmark }}" == "true" ]]; then
            args+=(--include-benchmark)
          fi

          python scripts/run_archive_maintenance.py "${args[@]}"

      - name: Publish maintenance summary
        if: always()
        run: |
          if [[ -f artifacts/ops/maintenance_status_latest.json ]]; then
            {
              echo "### Archive maintenance"
              echo
              echo '```json'
              cat artifacts/ops/maintenance_status_latest.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "maintenance report not found" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload maintenance artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: archive-maintenance-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            artifacts/ops/maintenance_status_latest.json
            artifacts/ops/archive_checksum_manifest.json
            artifacts/ops/stale_fact_markers_latest.json
            artifacts/ops/history/*.json
            eval/reports/phase9_eval_latest.json

  archive-alert:
    name: Open the archive maintenance failure issue
    needs: archive-maintenance
    if: "${{ always() && needs.archive-maintenance.result == 'failure' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Create failure alert issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            // The schedule is read from the event that started this run. A value the job
            // that installed packages wrote would be text from a job that is not trusted.
            const allowedSchedules = ['nightly', 'weekly', 'manual'];
            let schedule = 'nightly';
            if (context.eventName === 'workflow_dispatch') {
              const requested = (context.payload.inputs || {}).schedule;
              schedule = allowedSchedules.includes(requested) ? requested : 'unknown';
            } else if (context.payload.schedule === '23 4 * * 1') {
              schedule = 'weekly';
            }
            const title = `[ops] archive maintenance failure (${schedule})`;
            const bodyLines = [
              'Archive maintenance job failed.',
              '',
              `- schedule: ${schedule}`,
              `- workflow run: ${runUrl}`,
              `- commit: ${context.sha}`,
              '',
              'Please inspect the uploaded maintenance artifacts and logs.'
            ];
            const body = bodyLines.join('\n');

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });

            const existing = openIssues.find(
              (issue) => issue.title === title && !issue.pull_request
            );
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            });
