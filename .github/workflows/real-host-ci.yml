name: Real host CI

# Pinned claude, hermes, opencode, and codex for pull requests that change host
# install, the launcher, the session-start hook, or a test that imports them.
# The pins are the versions that ran headless on Linux with no credentials:
# claude 2.1.281 (Claude Code), Hermes Agent v0.19.0 (2026.7.20),
# opencode 1.18.32, codex-cli 0.158.0. The Codex hook tests run `codex exec`
# against a loopback mock of /v1/responses inside pytest, so nothing reaches
# the network.
# The Monday canary installs current claude, hermes, opencode, and codex and opens
# an [ops] issue when that run fails. The canary does not pin a version.
# A manual dispatch takes a `job` input. `all` runs every dispatch job. A job
# name runs that job alone, so the plugin hook trial can run on a branch that
# has no committed marketplace file.
# Pytest uses the setup-python interpreter recorded during the Alice
# install. The Hermes virtualenv bin stays on PATH so hermes resolves,
# and that package install does not include pytest.

on:
  pull_request:
    paths:
      - .github/workflows/real-host-ci.yml
      - apps/api/src/alicebot_api/host_install.py
      - apps/api/src/alicebot_api/host_launcher.py
      - apps/api/src/alicebot_api/session_start_hook.py
      - scripts/fuzz_codex_config_writer.py
      - tests/unit/launcher_helpers.py
      - tests/unit/test_absolute_uvx.py
      - tests/unit/test_claude_code_plugin.py
      - tests/unit/test_claude_code_session_start_hook.py
      - tests/unit/test_codex_config_install.py
      - tests/unit/test_codex_hook_install.py
      - tests/unit/test_codex_hook_real_host.py
      - tests/unit/test_data_dir_guard.py
      - tests/unit/test_hermes_config_install.py
      - tests/unit/test_hook_shell_quoting.py
      - tests/unit/test_host_install_receipt_values.py
      - tests/unit/test_host_install_reruns.py
      - tests/unit/test_host_install_round3.py
      - tests/unit/test_host_install_round4.py
      - tests/unit/test_host_install_round5.py
      - tests/unit/test_host_install_round6.py
      - tests/unit/test_host_install_round7.py
      - tests/unit/test_host_install_round7b.py
      - tests/unit/test_host_install_round8.py
      - tests/unit/test_host_install_writers.py
      - tests/unit/test_host_launcher.py
      - tests/unit/test_install_uv_warning.py
      - tests/unit/test_install_without_uvx.py
      - tests/unit/test_opencode_config_install.py
      - tests/unit/test_session_brief.py
      - tests/unit/test_sleep_time_proposals.py
      - tests/unit/test_session_hook_wire_text_notes.py
      - tests/unit/test_validity_on_by_default.py
      - plugins/alice-memory/**
      - .claude-plugin/**
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:
    inputs:
      job:
        description: Which dispatch job to run. all runs every one of them.
        type: choice
        options:
          - all
          - pinned
          - hook-trial
          - plugin-hook-trial
          - marketplace-check
        default: all

permissions:
  contents: read

concurrency:
  group: real-host-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pinned:
    name: Pinned real hosts
    if: "${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && (inputs.job == 'all' || inputs.job == 'pinned')) }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DISABLE_AUTOUPDATER: "1"
      DISABLE_UPDATES: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"

      - name: Install Alice
        run: |
          python -m pip install -e '.[dev]'
          echo "ALICE_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"

      - name: Install pinned Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.281

      - name: Install pinned Hermes
        run: |
          python -m venv "$RUNNER_TEMP/hermes-venv"
          "$RUNNER_TEMP/hermes-venv/bin/pip" install --disable-pip-version-check 'hermes-agent==0.19.0'
          echo "$RUNNER_TEMP/hermes-venv/bin" >> "$GITHUB_PATH"

      - name: Install pinned OpenCode
        run: npm install -g opencode-ai@1.18.32

      - name: Install pinned Codex
        run: npm install -g @openai/codex@0.158.0

      - name: Run real host tests
        env:
          ALICE_TEST_REAL_HOSTS: "1"
        run: |
          command -v claude
          command -v hermes
          command -v opencode
          command -v codex
          claude_version="$(claude --version)"
          hermes_report="$(hermes --version)"
          hermes_version="${hermes_report%%$'\n'*}"
          opencode_version="$(opencode --version)"
          codex_version="$(codex --version)"
          printf 'claude version: %s\n' "$claude_version"
          printf 'hermes version: %s\n' "$hermes_version"
          printf 'opencode version: %s\n' "$opencode_version"
          printf 'codex version: %s\n' "$codex_version"
          case "$claude_version" in
            "2.1.281 (Claude Code)") ;;
            *) echo "claude is not the pinned version"; exit 1 ;;
          esac
          case "$hermes_version" in
            "Hermes Agent v0.19.0 (2026.7.20)") ;;
            *) echo "hermes is not the pinned version"; exit 1 ;;
          esac
          case "$opencode_version" in
            1.18.32) ;;
            *) echo "opencode is not the pinned version"; exit 1 ;;
          esac
          case "$codex_version" in
            "codex-cli 0.158.0") ;;
            *) echo "codex is not the pinned version"; exit 1 ;;
          esac
          "$ALICE_PYTHON" -m pytest \
            tests/unit/test_claude_code_session_start_hook.py::test_real_claude_doctor_accepts_the_written_settings \
            tests/unit/test_hermes_config_install.py::test_real_hermes_loads_the_written_config \
            tests/unit/test_opencode_config_install.py::test_real_opencode_reads_the_written_config \
            tests/unit/test_opencode_config_install.py::test_real_opencode_rejects_a_broken_alice_entry \
            tests/unit/test_codex_config_install.py::test_real_codex_reads_the_written_config \
            tests/unit/test_codex_config_install.py::test_real_codex_rejects_a_broken_alice_entry \
            tests/unit/test_codex_config_install.py::test_real_codex_tools_key_and_table \
            tests/unit/test_claude_code_plugin.py::test_real_claude_validates_the_plugin \
            tests/unit/test_claude_code_plugin.py::test_real_claude_plugin_install_and_run \
            tests/unit/test_codex_hook_real_host.py::test_real_codex_runs_the_session_start_hook \
            tests/unit/test_codex_hook_real_host.py::test_real_codex_ignores_json_hook_output \
            tests/unit/test_codex_hook_real_host.py::test_real_codex_skips_a_hooks_file_with_an_http_handler \
            tests/unit/test_codex_hook_real_host.py::test_real_codex_and_install_agree_on_hooks_json_number_and_spelling_rules \
            tests/unit/test_codex_hook_real_host.py::test_real_codex_does_not_spill_a_large_brief \
            -q --tb=short -rP --junitxml "$RUNNER_TEMP/real-hosts.xml"
          "$ALICE_PYTHON" - "$RUNNER_TEMP/real-hosts.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          suites = [root] if root.tag == "testsuite" else list(root.findall("testsuite"))
          ran = sum(int(suite.attrib.get("tests", "0")) for suite in suites)
          skipped = sum(int(suite.attrib.get("skipped", "0")) for suite in suites)
          if ran != 15 or skipped != 0:
              raise SystemExit(
                  f"real host tests did not all run: tests={ran} skipped={skipped}"
              )
          PY

  canary:
    name: Unpinned real-host canary
    if: "${{ github.event_name == 'schedule' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    env:
      DISABLE_AUTOUPDATER: "1"
      DISABLE_UPDATES: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"

      - name: Install Alice
        run: |
          python -m pip install -e '.[dev]'
          echo "ALICE_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"

      - name: Install current Claude Code
        run: npm install -g @anthropic-ai/claude-code@latest

      - name: Install current Hermes
        run: |
          python -m venv "$RUNNER_TEMP/hermes-venv"
          "$RUNNER_TEMP/hermes-venv/bin/pip" install --disable-pip-version-check hermes-agent
          echo "$RUNNER_TEMP/hermes-venv/bin" >> "$GITHUB_PATH"

      - name: Install current OpenCode
        run: npm install -g opencode-ai@latest

      - name: Install current Codex
        run: npm install -g @openai/codex@latest

      - name: Run real host tests
        env:
          ALICE_TEST_REAL_HOSTS: "1"
        run: |
          command -v claude
          command -v hermes
          command -v opencode
          command -v codex
          printf 'claude version: %s\n' "$(claude --version)"
          printf 'hermes version: %s\n' "$(hermes --version)"
          printf 'opencode version: %s\n' "$(opencode --version)"
          printf 'codex version: %s\n' "$(codex --version)"
          "$ALICE_PYTHON" -m pytest \
            tests/unit/test_claude_code_session_start_hook.py::test_real_claude_doctor_accepts_the_written_settings \
            tests/unit/test_hermes_config_install.py::test_real_hermes_loads_the_written_config \
            tests/unit/test_opencode_config_install.py::test_real_opencode_reads_the_written_config \
            tests/unit/test_opencode_config_install.py::test_real_opencode_rejects_a_broken_alice_entry \
            tests/unit/test_codex_config_install.py::test_real_codex_reads_the_written_config \
            tests/unit/test_codex_config_install.py::test_real_codex_rejects_a_broken_alice_entry \
            tests/unit/test_codex_config_install.py::test_real_codex_tools_key_and_table \
            tests/unit/test_claude_code_plugin.py::test_real_claude_validates_the_plugin \
            tests/unit/test_claude_code_plugin.py::test_real_claude_plugin_install_and_run \
            tests/unit/test_codex_hook_real_host.py::test_real_codex_runs_the_session_start_hook \
            tests/unit/test_codex_hook_real_host.py::test_real_codex_ignores_json_hook_output \
            tests/unit/test_codex_hook_real_host.py::test_real_codex_skips_a_hooks_file_with_an_http_handler \
            tests/unit/test_codex_hook_real_host.py::test_real_codex_and_install_agree_on_hooks_json_number_and_spelling_rules \
            tests/unit/test_codex_hook_real_host.py::test_real_codex_does_not_spill_a_large_brief \
            -q --tb=short -rP --junitxml "$RUNNER_TEMP/real-hosts.xml"
          "$ALICE_PYTHON" - "$RUNNER_TEMP/real-hosts.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          suites = [root] if root.tag == "testsuite" else list(root.findall("testsuite"))
          ran = sum(int(suite.attrib.get("tests", "0")) for suite in suites)
          skipped = sum(int(suite.attrib.get("skipped", "0")) for suite in suites)
          if ran != 15 or skipped != 0:
              raise SystemExit(
                  f"real host tests did not all run: tests={ran} skipped={skipped}"
              )
          PY

      - name: Create failure alert issue
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = '[ops] real-host canary failure';
            const bodyLines = [
              'The weekly real-host canary failed.',
              '',
              'It installs the current claude, hermes, opencode, and codex CLIs with no version pin and runs the real-host tests, including the Codex SessionStart hook run.',
              '',
              `- workflow run: ${runUrl}`,
              `- commit: ${context.sha}`,
              '',
              'The pinned pull request job is a separate check.'
            ];
            const body = bodyLines.join('\n');

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });

            const existing = openIssues.find(
              (issue) => issue.title === title && !issue.pull_request
            );
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            });

  hook-trial:
    name: SessionEnd hook trial
    if: "${{ github.event_name == 'workflow_dispatch' && (inputs.job == 'all' || inputs.job == 'hook-trial') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DISABLE_AUTOUPDATER: "1"
      DISABLE_UPDATES: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"

      - name: Install Alice
        run: python -m pip install -e .

      - name: Install pinned Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.281

      - name: Run the hook trial
        run: python scripts/real_host_hook_trial.py run "$RUNNER_TEMP/artifacts" "$RUNNER_TEMP/trial"

      - name: Upload trial artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: ${{ runner.temp }}/artifacts/
          if-no-files-found: error

  plugin-hook-trial:
    name: Claude Code plugin hook trial
    if: "${{ github.event_name == 'workflow_dispatch' && (inputs.job == 'all' || inputs.job == 'plugin-hook-trial') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DISABLE_AUTOUPDATER: "1"
      DISABLE_UPDATES: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"

      - name: Install pinned Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.281

      - name: Run the plugin hook trial
        run: python scripts/real_host_plugin_hook_trial.py run "$RUNNER_TEMP/plugin-hook-trial" "$RUNNER_TEMP/plugin-hook-work"

      - name: Upload trial artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: plugin-hook-trial
          path: ${{ runner.temp }}/plugin-hook-trial/
          if-no-files-found: error

  marketplace-check:
    name: Claude Code marketplace check
    if: "${{ github.event_name == 'workflow_dispatch' && (inputs.job == 'all' || inputs.job == 'marketplace-check') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DISABLE_AUTOUPDATER: "1"
      DISABLE_UPDATES: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"

      - name: Install pinned Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.281

      - name: Validate the committed marketplace
        run: |
          test -f .claude-plugin/marketplace.json
          claude plugin validate . --strict --json
          ref="$(python3 -c 'import json; print(json.load(open(".claude-plugin/marketplace.json"))["plugins"][0]["source"]["ref"])')"
          version="${ref#v}"
          home="$(mktemp -d)"
          HOME="$home" claude plugin marketplace add ./ < /dev/null
          HOME="$home" claude plugin install "alice-memory@alicememory" < /dev/null
          HOME="$home" claude plugin list --json > "$RUNNER_TEMP/plugins.json"
          python3 - "$version" "$RUNNER_TEMP/plugins.json" << 'PY'
          import json
          import sys

          expected, path = sys.argv[1], sys.argv[2]
          payload = json.load(open(path, encoding="utf-8"))
          rows = payload if isinstance(payload, list) else payload.get("plugins", payload.get("items", []))
          if not isinstance(rows, list):
              raise SystemExit(f"plugin list was not a list: {payload}")
          matched = [
              row
              for row in rows
              if isinstance(row, dict)
              and row.get("id") == "alice-memory@alicememory"
              and row.get("enabled") is True
              and str(row.get("version")) == expected
          ]
          if len(rows) != 1 or len(matched) != 1:
              raise SystemExit(f"plugin list did not match {expected}: {payload}")
          PY
