                  assert tasks_typed_dict_annotate.__module__ == "typing"
                  assert tasks_typed_dict_annotate.__globals__ is vars(typing)
                  assert isinstance(tasks_typed_dict_annotate(1), dict)
              for tasks_dataclass in tasks_dataclasses:
                  tasks_init_annotate = tasks_dataclass.__init__.__annotate__
                  assert tasks_init_annotate.__module__ == "dataclasses"
                  assert tasks_init_annotate.__globals__["__name__"] == "dataclasses"
                  tasks_replace = tasks_dataclass.__replace__
                  assert tasks_replace.__module__ == "dataclasses"
                  assert tasks_replace.__globals__["__name__"] == "dataclasses"
              for owner_name, method_name in contracts_module._TASK_EXPLICIT_METHODS:
                  tasks_explicit_annotate = getattr(
                      getattr(getattr(contracts_module, owner_name), method_name),
                      "__annotate__",
                  )
                  assert tasks_explicit_annotate.__module__ == "alicebot_api.contracts"
                  assert tasks_explicit_annotate.__globals__ is vars(contracts_module)
                  assert tasks_explicit_annotate.__qualname__.startswith(f"{owner_name}.")
                  assert tasks_explicit_annotate.__qualname__.endswith("__annotate__")
                  assert isinstance(tasks_explicit_annotate(1), dict)
          PY
          python -m pytest -o pythonpath= \
            tests/unit/test_sqlite_onramp.py \
            tests/unit/test_config.py \
            tests/unit/test_cli_error_contracts.py \
            tests/unit/test_cli_package_split.py \
            tests/unit/test_mcp.py \
            tests/unit/test_mcp_error_contracts.py \
            tests/unit/test_mcp_package_split.py \
            -q

  python-integration:
    name: ${{ matrix.integration_check }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        integration_check: ["Integration tests (Postgres + pgvector, role separation)", "Default surface integration smoke (Postgres)"]
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
        env:
          POSTGRES_USER: alicebot_admin
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: alicebot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alicebot_admin -d alicebot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (repo-local venv — integration tests spawn scripts that require .venv)
        run: |
          python -m venv .venv
          ./.venv/bin/python -m pip install -e '.[dev]'
      - name: Bootstrap extension and app role
        # The app role must NOT be a superuser: superusers bypass row-level
        # security, which silently disables every isolation test.
        env:
          PGPASSWORD: ci
        run: |
          psql -h localhost -U alicebot_admin -d alicebot -v ON_ERROR_STOP=1 -c "
            CREATE EXTENSION IF NOT EXISTS vector;
            CREATE ROLE alicebot_app LOGIN PASSWORD 'ci';
            GRANT CONNECT ON DATABASE alicebot TO alicebot_app;
          "
          test "$(psql -h localhost -U alicebot_admin -d alicebot -Atqc "SELECT split_part(extversion, '.', 1)::int > 0 OR (split_part(extversion, '.', 1)::int = 0 AND split_part(extversion, '.', 2)::int >= 8) FROM pg_extension WHERE extname = 'vector'")" = "t"
      - name: Integration tests
        if: matrix.integration_check == 'Integration tests (Postgres + pgvector, role separation)'
        env:
          DATABASE_URL: postgresql://alicebot_app:ci@localhost:5432/alicebot
          DATABASE_ADMIN_URL: postgresql://alicebot_admin:ci@localhost:5432/alicebot
        # --timeout=180 names one test that runs that long. The cancelled
        # jobs were slow database setup, not a gap near 180s, so that flag
        # would not have fired. --session-timeout=1500 is checked between
        # tests, stops the run, and prints --durations before the 30 minute
        # job cancel.
        run: ALICE_LEGACY_SURFACES=1 ./.venv/bin/python -m pytest tests/integration -q -p no:cacheprovider --durations=20 --timeout=180 --session-timeout=1500

      - name: Default-surface core round-trip
        if: matrix.integration_check == 'Default surface integration smoke (Postgres)'
        env:
          DATABASE_URL: postgresql://alicebot_app:ci@localhost:5432/alicebot
          DATABASE_ADMIN_URL: postgresql://alicebot_admin:ci@localhost:5432/alicebot
        run: |
          unset ALICE_LEGACY_SURFACES ALICE_MCP_LEGACY_TOOLS ALICE_AGENT_API_KEY
          ./.venv/bin/python -m pytest \
            tests/integration/test_default_surface_integration.py \
            tests/integration/test_openai_agents_sdk_tool.py \
            -q -p no:cacheprovider --require-executed-tests

  web:
    name: Web tests, types, accessibility, and budgets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.23.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Provide local env (mirrors make setup)
        run: test -f .env.local || cp .env.local.example .env.local
      - name: Test
        run: pnpm test
      - name: Core coverage gate
        run: pnpm test:coverage:core
      - name: vNext coverage gate
        run: pnpm test:coverage:vnext
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Build
        run: pnpm build
      - name: Bundle budget
        run: pnpm test:budget
      - name: Install browser runtime
        # Hosted image already has the Chromium system libraries. A deps
        # install shells out to apt-get and has sat until the job timeout.
        timeout-minutes: 8
        run: pnpm exec playwright install chromium
      - name: Browser navigation and accessibility
        run: pnpm test:browser
      - name: Retain Playwright diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-diagnostics-${{ github.sha }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Advisory response validator tests
        run: pnpm test:advisory-audit
      - name: Production dependency audit
        # The pinned pnpm 10 audit client uses retired endpoints. Keep the
        # repository's fail-closed bulk-endpoint wrapper until a deliberate
        # Node/pnpm major-toolchain upgrade is independently qualified.
        run: node scripts/npm-advisory-audit.mjs --prod --audit-level=high
      - name: Full dependency audit
        run: node scripts/npm-advisory-audit.mjs --audit-level=high
