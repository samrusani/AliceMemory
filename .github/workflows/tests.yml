              f"{cli_package_path}"
          )
          assert not cli_parser_path.is_relative_to(repository_path), (
              "CLI parser carrier resolved to checkout source instead of the installed wheel: "
              f"{cli_parser_path}"
          )
          assert not cli_runner_path.is_relative_to(repository_path), (
              "CLI runner carrier resolved to checkout source instead of the installed wheel: "
              f"{cli_runner_path}"
          )
          assert not cli_build_parser_code_path.is_relative_to(repository_path), (
              "moved CLI parser resolved to checkout source instead of the installed wheel: "
              f"{cli_build_parser_code_path}"
          )
          assert not cli_main_code_path.is_relative_to(repository_path), (
              "moved CLI runner resolved to checkout source instead of the installed wheel: "
              f"{cli_main_code_path}"
          )
          assert cli_module.build_parser is cli_parser.build_parser
          assert cli_module.main is cli_runner.main
          assert not mcp_registry_path.is_relative_to(repository_path), (
              "MCP registry carrier resolved to checkout source instead of the installed wheel: "
