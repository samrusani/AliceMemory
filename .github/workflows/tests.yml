          moved_method = store_module.ContinuityStore.create_model_provider
          moved_signature = inspect.signature(moved_method)
          moved_annotations = inspect.get_annotations(moved_method, eval_str=False)
          assert moved_method.__globals__ is vars(store_module)
          assert moved_method.__module__ == "alicebot_api.store"
          assert moved_method.__qualname__ == "ContinuityStore.create_model_provider"
          assert list(moved_signature.parameters)[:3] == [
              "self",
              "workspace_id",
              "created_by_user_account_id",
          ]
          assert "ModelProviderRow" in str(moved_signature.return_annotation)
          assert "UUID" in str(moved_annotations["workspace_id"])
          conversation_memory_moved_method = store_module.ContinuityStore.append_event_if_tail
          conversation_memory_signature = inspect.signature(conversation_memory_moved_method)
          conversation_memory_annotations = inspect.get_annotations(
              conversation_memory_moved_method,
              eval_str=False,
          )
          assert conversation_memory.AppendOnlyViolation is store_module.AppendOnlyViolation
          assert conversation_memory_moved_method.__globals__ is vars(store_module)
          assert conversation_memory_moved_method.__module__ == "alicebot_api.store"
          assert conversation_memory_moved_method.__qualname__ == (
              "ContinuityStore.append_event_if_tail"
          )
          assert conversation_memory_moved_method.__code__.co_qualname == (
              "ContinuityStore.append_event_if_tail"
          )
          assert list(conversation_memory_signature.parameters)[:4] == [
              "self",
              "thread_id",
              "session_id",
              "kind",
          ]
          assert "EventRow" in str(conversation_memory_signature.return_annotation)
          assert "JsonObject" in str(conversation_memory_annotations["payload"])
          assert "The same transaction-scoped advisory lock" in (
              conversation_memory_moved_method.__doc__ or ""
          )
          continuity_moved_method = store_module.ContinuityStore.create_continuity_object
          continuity_signature = inspect.signature(continuity_moved_method)
          continuity_annotations = inspect.get_annotations(
              continuity_moved_method,
              eval_str=False,
          )
          assert (
              continuity.ContinuityStoreInvariantError
              is store_module.ContinuityStoreInvariantError
          )
