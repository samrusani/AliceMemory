          )
          assert mcp_tools_module.call_mcp_tool is mcp_registry.call_mcp_tool
          assert len(mcp_registry._CORE_TOOL_DEFINITIONS) == 11
          assert len(mcp_registry._LEGACY_TOOL_DEFINITIONS) == 65
          assert len(mcp_registry._TOOL_HANDLERS) == 76
          assert not carrier_path.is_relative_to(repository_path), (
