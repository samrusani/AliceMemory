          contracts_integrations_carrier_path = Path(
              contracts_integrations.__file__
          ).resolve()
          contracts_execution_carrier_path = Path(
              contracts_execution.__file__
          ).resolve()
          moved_code_path = Path(store_module.ContinuityStore.create_model_provider.__code__.co_filename).resolve()
          conversation_memory_moved_code_path = Path(
