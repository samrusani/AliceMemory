          cli_package_path = Path(cli_module.__file__).resolve()
          cli_parser_path = Path(cli_parser.__file__).resolve()
          cli_runner_path = Path(cli_runner.__file__).resolve()
          cli_build_parser_code_path = Path(
              cli_module.build_parser.__code__.co_filename
          ).resolve()
          cli_main_code_path = Path(cli_module.main.__code__.co_filename).resolve()
          mcp_registry_path = Path(mcp_registry.__file__).resolve()
          mcp_handler_code_path = Path(
