name: Security Scans

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  secrets:
    name: Secrets Scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          checksums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          release_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"

          curl -sSfL "${release_url}/${archive}" -o "/tmp/${archive}"
          curl -sSfL "${release_url}/${checksums}" -o "/tmp/${checksums}"

          cd /tmp
          grep "  ${archive}$" "${checksums}" | sha256sum -c -
          tar -xzf "${archive}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Resolve gitleaks commit range
        id: gitleaks_scope
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "log_opts=${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            echo "log_opts=${{ github.event.before }}..${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "log_opts=HEAD" >> "$GITHUB_OUTPUT"
          fi

      - name: Run gitleaks
        run: gitleaks detect --source . --no-banner --redact --verbose --log-opts "${{ steps.gitleaks_scope.outputs.log_opts }}"

  bandit:
    name: Python SAST (Bandit, baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install bandit
        run: python -m pip install --disable-pip-version-check "bandit>=1.8,<2.0"

      # Baseline mode, deliberately. A first scan of this codebase reports 338
      # findings, mostly low confidence, and gating on all of them would mean
      # triaging the backlog before any new code could merge. Recording the
      # current state instead means a regression fails immediately while the
      # existing set is worked down separately. Regenerate the baseline with:
      #   bandit -r apps/api/src/alicebot_api -f json -o .bandit-baseline.json
      # and say in the pull request why each newly baselined finding is safe.
      - name: Run bandit against the recorded baseline
        run: |
          test -f .bandit-baseline.json
          bandit -r apps/api/src/alicebot_api -b .bandit-baseline.json -q

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - python
          - javascript
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4

      - name: Analyze
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
