name: Phase 5 Ops Evidence

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ops-evidence:
    name: Backup, restore, upgrade, and monitoring evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
        env:
          POSTGRES_USER: alicebot_root
          POSTGRES_PASSWORD: ci-root
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alicebot_root -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_ADMIN_URL: postgresql://alicebot_admin:ci-admin@localhost:5432/alicebot
      DATABASE_URL: postgresql://alicebot_app:ci-app@localhost:5432/alicebot
      DATABASE_BACKUP_URL: postgresql://alicebot_backup:ci-backup@localhost:5432/alicebot
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Select PostgreSQL 16 client tools
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          bash scripts/ci_apt_get.sh postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/16/bin/pg_dump --version
          /usr/lib/postgresql/16/bin/pg_restore --version

      - name: Install Alice and test dependencies
        run: |
          python -m venv .venv
          ./.venv/bin/python -m pip install -e '.[dev]'

      - name: Bootstrap extensions and least-privilege roles
        env:
          PGHOST: localhost
          PGUSER: alicebot_root
          PGPASSWORD: ci-root
        run: |
          psql --dbname template1 --set ON_ERROR_STOP=1 <<'SQL'
          CREATE EXTENSION IF NOT EXISTS pgcrypto;
          CREATE EXTENSION IF NOT EXISTS vector;
          SQL

          psql --dbname postgres --set ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE alicebot_admin
            LOGIN PASSWORD 'ci-admin'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
          CREATE ROLE alicebot_app
            LOGIN PASSWORD 'ci-app'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
          CREATE ROLE alicebot_backup
            LOGIN PASSWORD 'ci-backup'
            NOSUPERUSER NOCREATEDB NOCREATEROLE BYPASSRLS;
          CREATE ROLE alicebot_drill
            LOGIN PASSWORD 'ci-drill'
            NOSUPERUSER CREATEDB NOCREATEROLE NOBYPASSRLS;
          SQL

          psql --dbname postgres --set ON_ERROR_STOP=1 \
            --command "CREATE DATABASE alicebot OWNER alicebot_admin TEMPLATE template1"
          psql --dbname alicebot --set ON_ERROR_STOP=1 \
            --command "GRANT CONNECT ON DATABASE alicebot TO alicebot_app, alicebot_backup"

          test "$(
            psql --dbname postgres --tuples-only --no-align --command "
              SELECT rolname, rolsuper, rolcreatedb, rolcreaterole, rolbypassrls
              FROM pg_roles
              WHERE rolname IN (
                'alicebot_admin',
                'alicebot_app',
                'alicebot_backup',
                'alicebot_drill'
              )
              ORDER BY rolname
            "
          )" = "alicebot_admin|f|f|f|f
          alicebot_app|f|f|f|f
          alicebot_backup|f|f|f|t
          alicebot_drill|f|t|f|f"
          test "$(
            psql --dbname postgres --tuples-only --no-align --command "
              SELECT rolsuper
              FROM pg_roles
              WHERE rolname = 'alicebot_root'
            "
          )" = "t"
          test "$(
            psql --dbname template1 --tuples-only --no-align --command "
              SELECT string_agg(extname, ',' ORDER BY extname)
              FROM pg_extension
              WHERE extname IN ('pgcrypto', 'vector')
            "
          )" = "pgcrypto,vector"
          test "$(
            psql --dbname alicebot --tuples-only --no-align --command "
              SELECT string_agg(extname, ',' ORDER BY extname)
              FROM pg_extension
              WHERE extname IN ('pgcrypto', 'vector')
            "
          )" = "pgcrypto,vector"

      - name: Run evidence contract tests
        run: >-
          ./.venv/bin/python -m pytest
          tests/unit/test_phase5_ops_evidence.py
          tests/unit/test_least_privilege_deployment_workflow.py
          tests/unit/test_phase5_enterprise_handoff_truth.py
          tests/unit/test_v0140_deployment_guide_fixes_handoff_truth.py
          -q -p no:cacheprovider

      - name: Migrate the deployment database as the non-superuser admin
        run: ./scripts/migrate.sh

      - name: Prove empty-user seed and workspace bootstrap
        env:
          ALICEBOT_LEAST_PRIVILEGE_DEPLOYMENT: "1"
        run: >-
          ./.venv/bin/python -m pytest
          tests/integration/test_local_workspace_bootstrap_api.py::test_documented_empty_users_seed_then_workspace_bootstrap_under_least_privilege_roles
          -q -p no:cacheprovider --require-executed-tests

      - name: Emit the deployment configuration contract
        run: |
          mkdir -p artifacts/phase5
          ./.venv/bin/python scripts/run_single_tenant_deployment_smoke.py \
            --environment ephemeral_ci \
            --output artifacts/phase5/single-tenant-deployment-smoke.json

      - name: Execute both backend drills with the dedicated backup role
        env:
          DATABASE_LIFECYCLE_URL: postgresql://alicebot_drill:ci-drill@localhost:5432/postgres
        run: |
          mkdir -p artifacts/phase5
          ./.venv/bin/python scripts/run_phase5_ops_evidence.py \
            --backend all \
            --work-dir "${RUNNER_TEMP}" \
            --output artifacts/phase5/ops-evidence.json

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: phase5-ops-evidence
          path: |
            artifacts/phase5/ops-evidence.json
            artifacts/phase5/single-tenant-deployment-smoke.json
          if-no-files-found: error
          retention-days: 14
