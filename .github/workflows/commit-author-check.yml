name: Commit author check

on:
  pull_request:

permissions:
  contents: read

jobs:
  commit-authors:
    name: Author and committer emails
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Both pull request SHAs must be present. The default depth is the
          # merge commit only, which is not enough to walk the merge range.
          fetch-depth: 0

      - name: Reject emails outside the allowlist
        run: >-
          python3 scripts/check_commit_authors.py
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"
