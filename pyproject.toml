[build-system]
requires = ["setuptools==84.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "alice-memory"
version = "0.17.0"
description = "Alice: the continuity layer for AI agents. Local-first memory with provenance, open loops, resumption, and review-governed writes."
readme = "docs/pypi-description.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sami Rusani" }]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "alembic>=1.14,<2.0",
  "fastapi>=0.115,<1.0",
  "numpy>=1.26,<3.0",
  "psycopg[binary,pool]>=3.2,<4.0",
  "redis>=5.0,<9.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn>=0.34,<1.0",
]

[project.urls]
Homepage = "https://github.com/samrusani/AliceMemory"
Repository = "https://github.com/samrusani/AliceMemory"
Issues = "https://github.com/samrusani/AliceMemory/issues"
Changelog = "https://github.com/samrusani/AliceMemory/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "bandit>=1.8,<2.0",
  "build>=1.3,<2.0",
  "coverage>=7.7,<8.0",
  "mypy>=1.16,<3.0",
  "pytest>=8.3,<10.0",
  "pytest-cov>=6.2,<8.0",
  # Test oracle only: Hermes reads config.yaml with PyYAML, so the Hermes
  # install tests judge the written file with it. Runtime code never imports it.
  "pyyaml>=6.0,<7.0",
  "ruff>=0.12,<1.0",
  "twine>=6.1,<8.0",
  "virtualenv>=20.32,<22.0",
]

[project.scripts]
alice = "alicebot_api.cli:main"
alice-memory = "alicebot_api.onramp:main"
alice-memory-session-start = "alicebot_api.session_start_hook:main"
alicebot = "alicebot_api.cli:main"
alicebot-mcp = "alicebot_api.mcp_server:main"

[tool.setuptools.package-dir]
"" = "."

[tool.setuptools.packages.find]
where = ["apps/api/src", "workers"]

[tool.pytest.ini_options]
pythonpath = ["apps/api/src", "workers"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# Start with correctness-only checks. Broad style cleanup is intentionally not
# part of the patch-release gate.
select = ["E9", "F63", "F7", "F82"]

[tool.coverage.run]
branch = true
source = ["alicebot_api"]

[tool.coverage.report]
show_missing = true
skip_covered = true
